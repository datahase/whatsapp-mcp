# One application container. Docker picks the image variant for the host
# (linux/amd64 or linux/arm64); nothing here forces an architecture.
#
# Setup: ./scripts/init-env.sh  (creates .env with a random token and admin
# password), edit .env, then: docker compose up -d
#
# Settings come from .env. The port is published on localhost only unless
# BIND_IP is set to another interface (LAN, VPN or Tailscale address).
name: whatsapp-mcp

services:
  whatsapp-mcp:
    image: ${WHATSAPP_MCP_IMAGE:-datahase/whatsapp-mcp:latest}
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${HOST_PORT:-8765}:8765"
    # All settings and keys come from .env (see .env.example).
    env_file:
      - path: .env
        required: true
    volumes:
      - whatsapp-mcp-data:/data
      # Optional advanced settings (limits, expected phones): uncomment and
      # create config.yaml from config.example.yaml.
      # - ./config.yaml:/config/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${MEM_LIMIT:-512m}
    cpus: ${CPUS:-1.0}
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  whatsapp-mcp-data:
