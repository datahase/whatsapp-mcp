# whatsapp-mcp configuration. Copy to config.yaml (which is git-ignored).
# Secrets are never written here; only the paths of mounted secret files.

listen: 0.0.0.0:8765          # inside the container; the host side is set in compose.yaml
data_dir: /data
# public_url: https://whatsapp.example.com  # enables OAuth; use your own HTTPS origin
# oauth_only: true                        # disables static-token API access
log_level: INFO               # DEBUG, INFO, WARN, ERROR

# Host names/IPs clients use to reach this server, besides localhost.
# Requests with any other Host or Origin header are rejected.
allowed_hosts: []
#  - 192.168.1.20
#  - my-server.tailnet-name.ts.net

# Secrets come from environment variables (WHATSAPP_MCP_TOKEN,
# WHATSAPP_MCP_ADMIN_PASSWORD, AI_API_KEY; see .env.example). To use files
# instead (e.g. Docker secrets), set WHATSAPP_MCP_TOKEN_FILE etc., or:
# auth:
#   token_file: /run/secrets/mcp_token
#   admin_password_file: /run/secrets/admin_password

# Normally add accounts through the admin interface. Advanced preconfigured
# accounts remain supported; IDs must stay stable after pairing.
accounts: []
#  - id: work
#    label: Work
#    expected_phone: "15551234567"

limits:
  send_min_interval: 45s        # app policy, not an official WhatsApp limit
  sends_per_hour: 30
  non_contact_min_interval: 90s
  non_contact_per_hour: 15
  max_media_bytes: 33554432     # 32 MiB per file
  max_inline_bytes: 2097152     # 2 MiB inline image/audio in tool results
  media_cache_bytes: 536870912  # 512 MiB downloaded-media cache, all accounts
  staged_upload_ttl: 24h
  message_cache_bytes: 268435456  # 256 MiB; message storage pauses (never purges) above this
  max_queued_jobs: 8

# Optional analysis. Environment variables (AI_*) override these values.
# WhatsApp reading/sending works with this disabled. Personal media always
# uses api key below/AI_API_KEY; there is no fallback to a free tier.
ai:
  enabled: false
  provider: gemini            # gemini | openai | groq | openrouter | anthropic | openai_compatible
  # transcribe_provider: deepgram   # default: same as provider; also deepgram | elevenlabs | assemblyai
  # base_url: ""              # per-provider default; required for openai_compatible
  # transcribe_base_url: ""
  # api_key_file: /run/secrets/ai_api_key   # alternative to the <PROVIDER>_API_KEY variables
  transcribe_model: gemini-3.5-transcribe
  analysis_model: gemini-3.5-flash-lite
  quality_model: gemini-3.8-flash      # used only when a tool call sets high_quality=true
  # transcribe_method: chat            # OpenAI-shaped providers: chat or audio_transcriptions
  # audio_format: original             # chat transcription defaults to wav
  # allow_free_models: false           # ":free" model IDs are refused for personal media
  # test_key_file: /run/secrets/ai_test_key  # only for `ai-smoke -tier test` with non-sensitive fixtures
  default_target_language: en
  daily_audio_minutes: 30              # app allowance, not a provider billing cap
  daily_requests: 50
  max_audio_seconds: 600
  max_output_tokens: 4096
  request_timeout: 120s
  wait_for_result: 45s
